# Local infrastructure.
#
# PostgreSQL is intentionally ABSENT: the project uses Neon (managed serverless
# Postgres) for every environment including local development, so dev and
# production run identical schemas and connection semantics. Point DATABASE_URL
# at a Neon branch — branching gives each developer an isolated database in
# seconds, which is strictly better than a local container that drifts.
#
# Redis stays local: it holds only ephemeral queue state.
#
#   docker compose -f infra/docker/docker-compose.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: soe-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local Postgres, for working offline against a Neon-compatible
  # schema. Not the default path.
  #   docker compose --profile local-db up -d
  postgres:
    image: postgres:16-alpine
    container_name: soe-postgres
    profiles: ['local-db']
    environment:
      POSTGRES_USER: soe
      POSTGRES_PASSWORD: soe
      POSTGRES_DB: soe
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soe']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
